spring:
  application:
    name: daedong-matmap

  datasource:
    url: jdbc:postgresql://localhost:5432/daedong_matmap
    username: daedong
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  server:
    port: 8080

  logging:
    level:
      org.hibernate.SQL: debug
      org.hibernate.orm.jdbc.bind: trace